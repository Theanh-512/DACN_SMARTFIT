<section class="contact-section">
  <div class="contact-container">
    <app-ui-section-header
      badge="Kết Nối Với Chúng Tôi"
      title="Liên Hệ Tư Vấn Trực Tiếp"
      subtitle="Để lại thông tin để nhận hỗ trợ nhanh chóng từ chuyên gia thể hình và công nghệ của SmartFit Studio."
    />

    <div class="contact-layout">
      <div class="contact-info">
        <h3>Thông Tin Trụ Sở</h3>
        <p class="tagline">{{ brand.tagline }}</p>

        <div class="info-list">
          <div class="info-item">
            <span class="info-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </span>
            <div>
              <strong>Địa chỉ:</strong>
              <p>{{ brand.contact.address }}</p>
            </div>
          </div>

          <div class="info-item">
            <span class="info-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            </span>
            <div>
              <strong>Hotline:</strong>
              <p>{{ brand.contact.hotline }}</p>
            </div>
          </div>

          <div class="info-item">
            <span class="info-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <div>
              <strong>Email:</strong>
              <p>{{ brand.contact.email }}</p>
            </div>
          </div>
        </div>

        <div class="hours-card">
          <h4>Thời Gian Hoạt Động</h4>
          <p>Thứ Hai - Thứ Bảy: 06:00 - 22:00</p>
          <p>Chủ Nhật: 07:00 - 20:00</p>
        </div>
      </div>

      <div class="contact-form-wrapper">
        <app-ui-contact-form (formSubmitted)="handleFormSubmission($event)" />
      </div>
    </div>
  </div>
</section>
