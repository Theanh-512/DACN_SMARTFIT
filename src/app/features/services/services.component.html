<section class="services-section">
  <div class="services-container">
    <app-ui-section-header
      badge="Hệ Sinh Thái Thông Minh"
      title="Dịch Vụ Nổi Bật Tại SmartFit Studio"
      subtitle="Kết hợp hoàn hảo giữa thiết bị chuẩn thể thao chuyên nghiệp và nền tảng công nghệ số hoá hiện đại."
    />

    <div class="services-grid">
      @for (item of servicesList; track item.id) {
        <app-ui-content-card
          [title]="item.name"
          [subtitle]="item.description"
          [icon]="item.icon"
        >
          <div class="benefits-box">
            <h4>Lợi ích vượt trội:</h4>
            <ul>
              @for (b of item.benefits; track b) {
                <li>✓ {{ b }}</li>
              }
            </ul>
          </div>

          <div class="service-action">
            <app-ui-button variant="outline" size="sm" (clicked)="consultService(item)">
              Đăng Ký Tư Vấn &rarr;
            </app-ui-button>
          </div>
        </app-ui-content-card>
      }
    </div>
  </div>
</section>
