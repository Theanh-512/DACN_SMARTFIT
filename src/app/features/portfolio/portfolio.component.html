<section class="portfolio-section">
  <div class="portfolio-container">
    <app-ui-section-header
      badge="Các Câu Chuyện Thành Công"
      title="Dự Án Đã Thực Hiện"
      subtitle="Minh chứng thực tế về năng lực chuyển đổi số và công nghệ vận hành phòng tập hiện đại."
    />

    <div class="portfolio-grid">
      @for (c of cases; track c.title) {
        <app-ui-content-card
          [title]="c.title"
          [subtitle]="c.description"
          [badge]="c.category"
          [icon]="c.icon"
        >
          <div class="metric-highlight">
            <span class="label">Kết quả đạt được:</span>
            <span class="value">{{ c.metric }}</span>
          </div>
        </app-ui-content-card>
      }
    </div>
  </div>
</section>
